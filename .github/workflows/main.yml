
name: Build XLemonWifi Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 下载 GitHub 仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vue/package-lock.json

      # 3. 安装 Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 4. 构建 Vue 前端
      - name: Build Frontend
        working-directory: Vue
        run: |
          npm ci
          npm run build

      # 5. 构建 Spring Boot 后端
      - name: Build Backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      # 6. 整理前后端文件
      - name: Prepare Package
        run: |
          mkdir -p package/frontend
          mkdir -p package/backend

          cp -r Vue/dist package/frontend/
          cp target/XLemonWifi-0.0.1-SNAPSHOT.jar package/backend/app.jar

          cat > package/README.txt <<'EOF'
          XLemonWifi Deployment Package

          Frontend:
          frontend/dist/

          Backend:
          backend/app.jar

          Requirements:
          Java 17 or newer

          Start backend:
          java -jar backend/app.jar

          Backend port:
          992

          Health check:
          http://127.0.0.1:992/health

          Note:
          The original WiFi password-attempt functionality
          has been disabled in this safe build.
          EOF

      # 7. 合并成 ZIP
      - name: Create ZIP
        run: |
          cd package
          zip -r ../XLemonWifi-deploy.zip .

      # 8. 上传构建产物
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: XLemonWifi-deploy
          path: XLemonWifi-deploy.zip
          retention-days: 30
